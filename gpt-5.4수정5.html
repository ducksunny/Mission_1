<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>숲 해설 프로그램</title>
<style>
body{
  font-family:"Malgun Gothic",sans-serif;
  background:#f4faf4;
  margin:0;
  padding:20px;
  color:#243024;
}
.wrap{
  max-width:960px;
  margin:auto;
  background:#fff;
  padding:20px;
  border-radius:16px;
  box-shadow:0 4px 12px rgba(0,0,0,.08);
}
h1{color:#1f4d2b;margin-top:0}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:12px;
  margin-bottom:20px;
}
label{
  display:block;
  font-weight:bold;
  margin-bottom:6px;
}
select,button{
  width:100%;
  padding:10px;
  font-size:16px;
  border-radius:10px;
  border:1px solid #cfe0cf;
  box-sizing:border-box;
}
button{
  border:none;
  font-weight:bold;
  cursor:pointer;
}
#make{background:#2f6b3b;color:#fff}
#reset{background:#eaf4ea;color:#1f4d2b;margin-top:8px}
#result{
  display:none;
  margin-top:20px;
  padding:18px;
  background:#eef8ef;
  border-radius:12px;
}
.card{
  background:#fff;
  border:1px solid #dbe9db;
  border-radius:10px;
  padding:12px;
  margin-top:12px;
  line-height:1.7;
}
ul,ol{margin:8px 0 0 20px}
strong{color:#1f4d2b}
@media (max-width:700px){
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>대상자별 맞춤 숲 해설 프로그램</h1>

  <div class="grid">
    <div>
      <label for="target">대상자</label>
      <select id="target">

        <option value="초등">초등</option>
        <option value="사회초년생">사회초년생</option>
      </select>
    </div>

    <div>
      <label for="season">계절</label>
      <select id="season">
        <option value="">선택하세요</option>
        <option value="봄">봄</option>
        <option value="여름">여름</option>
        <option value="가을">가을</option>
        <option value="겨울">겨울</option>
      </select>
    </div>

    <div>
      <label>&nbsp;</label>
      <button id="make" type="button">프로그램 생성</button>
      <button id="reset" type="button">초기화</button>
    </div>
  </div>

  <div id="result"></div>
</div>
