<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>대상자별 맞춤 숲 해설 프로그램</title>
  <style>
    :root {
      --green-900: #1f4d2b;
      --green-800: #2f6b3b;
      --green-700: #3f7f4d;
      --green-500: #67a36f;
      --green-200: #dff1e2;
      --green-100: #eef8ef;
      --bg: #f6fbf6;
      --card: rgba(255, 255, 255, 0.9);
      --text: #223022;
      --muted: #5c6d5e;
      --line: #d9e7da;
      --warn: #fff5de;
      --shadow: 0 10px 30px rgba(31, 77, 43, 0.08);
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, #eef8ef 0%, #f8fcf8 45%, #f4f9f4 100%);
      line-height: 1.65;
    }

    .wrap {
      max-width: 1180px;
      margin: 0 auto;
      padding: 24px;
    }

    .hero {
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #245a31, #4c8a57 65%, #71b07b);
      color: white;
      padding: 34px 28px;
      border-radius: 28px;
      box-shadow: var(--shadow);
      margin-bottom: 24px;
    }

    .hero::after {
      content: "";
      position: absolute;
      right: -40px;
      top: -40px;
      width: 180px;
      height: 180px;
      background: rgba(255,255,255,0.12);
      border-radius: 50%;
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: 32px;
      letter-spacing: -0.5px;
    }

    .hero p {
      margin: 6px 0;
      opacity: 0.96;
    }

    .panel {
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.65);
      backdrop-filter: blur(8px);
      border-radius: 24px;
      padding: 22px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }

    .panel-title {
      margin: 0 0 16px;
      color: var(--green-900);
      font-size: 20px;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      align-items: end;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--green-900);
    }

    select, button {
      width: 100%;
      border-radius: 14px;
      font-size: 16px;
      padding: 13px 14px;
      border: 1px solid var(--line);
      outline: none;
    }

    select {
      background: #fff;
      color: var(--text);
    }

    select:focus, button:focus {
      box-shadow: 0 0 0 4px rgba(103, 163, 111, 0.15);
    }

    .btn {
      cursor: pointer;
      font-weight: 700;
      transition: 0.2s ease;
      border: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--green-800), var(--green-700));
      color: #fff;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      filter: brightness(0.98);
    }

    .btn-secondary {
      background: #edf5ee;
      color: var(--green-900);
      border: 1px solid var(--line);
    }

    .btn-secondary:hover {
      background: #e4f0e6;
    }

    .button-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .note {
      margin-top: 12px;
      color: var(--muted);
      font-size: 14px;
    }

    .result {
      display: none;
      animation: fadeIn 0.35s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .title-box {
      background: linear-gradient(135deg, #f1f8f1, #f7fbf7);
      border: 1px solid var(--line);
      border-left: 7px solid var(--green-700);
      padding: 20px;
      border-radius: 18px;
      margin-bottom: 18px;
    }

    .title-box h2 {
      margin: 0 0 8px;
      font-size: 28px;
      color: var(--green-900);
    }

    .title-box p {
      margin: 0;
      color: var(--muted);
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }

    .tag {
      background: var(--green-200);
      color: var(--green-900);
      font-size: 14px;
      padding: 7px 12px;
      border-radius: 999px;
      font-weight: 700;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
      margin-bottom: 18px;
    }

    .card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 4px 14px rgba(31, 77, 43, 0.04);
    }

    .card h3 {
      margin: 0 0 10px;
      font-size: 18px;
      color: var(--green-800);
    }

    .card p {
      margin: 0;
    }

    .order-box {
      overflow: hidden;
      border-radius: 20px;
      border: 1px solid var(--line);
      background: #fcfffc;
      margin-bottom: 18px;
    }

    .step {
      padding: 18px;
      border-bottom: 1px solid #e5efe6;
    }

    .step:last-child {
      border-bottom: none;
    }

    .step h4 {
      margin: 0 0 8px;
      color: var(--green-900);
      font-size: 17px;
    }

    .safe {
      background: var(--warn);
    }

    ul {
      margin: 8px 0 0 18px;
      padding: 0;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 26px 10px;
      font-weight: 600;
    }

    .footer-note {
      margin-top: 12px;
      font-size: 14px;
      color: var(--muted);
    }

    .mini-info {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-top: 10px;
    }

    .mini-box {
      background: #f8fcf8;
      border: 1px dashed var(--line);
      border-radius: 14px;
      padding: 12px;
      font-size: 14px;
      color: var(--muted);
    }

    @media (max-width: 640px) {
      .wrap {
        padding: 14px;
      }

      .hero {
        padding: 26px 20px;
        border-radius: 22px;
      }

      .hero h1 {
        font-size: 26px;
      }

      .title-box h2 {
        font-size: 23px;
      }

      .button-group {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <h1>대상자별 맞춤 숲 해설 프로그램</h1>
      <p>대상자와 계절을 선택하면 맞춤형 숲 해설 프로그램이 자동으로 생성됩니다.</p>
      <p><strong>구성 순서:</strong> 안전규칙 → 도입 → 전개 → 마무리</p>
    </section>

    <section class="panel">

        <div>

            <option value="여름">여름</option>
            <option value="가을">가을</option>
            <option value="겨울">겨울</option>
          </select>
        </div>

        <div>
          <label>&nbsp;</label>

            <button class="btn btn-secondary" onclick="resetForm()">초기화</button>

        </div>
      </div>

      <div class="mini-info">
        <div class="mini-box">5개 대상자 × 4계절 구성</div>
        <div class="mini-box">실내 연계활동 및 준비물 포함</div>
        <div class="mini-box">대상자별 심리·발달 특성 반영</div>
      </div>

      <p class="note">※ 현장 적용 시 날씨, 이동 거리, 참여자의 건강 상태에 따라 시간을 조절하세요.</p>
    </section>

    <section id="result" class="panel result"></section>
  </div>
