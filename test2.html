<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"></head>
<body>

<div id="screen1">
  <h2>화면 1 (선택 화면)</h2>
  <button onclick="change()">결과 보기</button>
</div>

<div id="screen2" style="display:none;">
  <h2>화면 2 (결과 화면)</h2>
  <p id="result"></p>
</div>

<script>
function change() {
  document.getElementById("result").innerHTML = "성공! 결과가 보입니다!";
  document.getElementById("screen1").style.display = "none";
  document.getElementById("screen2").style.display = "block";
}
</script>

</body>
</html>
