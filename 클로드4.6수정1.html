const targets = [

  { label: '💼 사회초년생', value: '사회초년생' },
  { label: '🌳 50대 남녀', value: '50대' },
  { label: '🌸 시니어', value: '시니어' }
];
const seasons = [
  { label: '🌸 봄', value: '봄' },
  { label: '☀️ 여름', value: '여름' },
  { label: '🍂 가을', value: '가을' },
  { label: '❄️ 겨울', value: '겨울' }
];

function createButtons(items, groupId, type) {
  const group = document.getElementById(groupId);
  items.forEach(item => {
    const btn = document.createElement('button');
    btn.className = 'btn';
    btn.textContent = item.label;
    btn.addEventListener('click', function() {
      document.querySelectorAll('#' + groupId + ' .btn')
        .forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      state[type] = item.value;
      if (state.target && state.season) renderResult();
    });
    group.appendChild(btn);
  });
}

createButtons(targets, 'targetGroup', 'target');
createButtons(seasons, 'seasonGroup', 'season');

// ── 우천 토글 ──
function toggleRain() {
  const el = document.getElementById('rainSection');
  const btn = document.getElementById('rainBtn');
  el.classList.toggle('show');
  btn.textContent = el.classList.contains('show')
    ? '🌂 우천 대체 프로그램 닫기'
    : '🌂 우천 시 실내 대체 프로그램 보기';
}

// ── 결과 렌더링 ──
function renderResult() {
  const d = getData(state.target, state.season);
  if (!d) return;

  const area = document.getElementById('resultArea');
  area.style.display = 'block';
  area.innerHTML = `
    <div class="result-title">${d.emoji} ${d.title}</div>
    <div class="result-keyword">🔑 키워드 : ${d.keyword}</div>

    <div class="info-grid">
      <div class="info-box"><strong>👤 생애주기 특성</strong>${d.lifecycle}</div>
      <div class="info-box"><strong>📍 해설 장소</strong>${d.place}</div>
    </div>

    <div class="section-card safety-card">
      <h3>🚨 안전규칙 (최우선)</h3>
      <ul>${d.safety.map(s => '<li>' + s + '</li>').join('')}</ul>
    </div>

    <div class="section-card">
      <h3>🌱 도입</h3>
      <ul>${d.intro.map(s => '<li>' + s + '</li>').join('')}</ul>
    </div>

    <div class="section-card">
      <h3>🌿 전개</h3>
      <ul>${d.main.map(s => '<li>' + s + '</li>').join('')}</ul>
    </div>

    <div class="section-card">
      <h3>🍃 마무리</h3>
      <ul>${d.closing.map(s => '<li>' + s + '</li>').join('')}</ul>
    </div>

    <div class="section-card music-card">
      <h3>🎵 추천 음악</h3>
      <ul>${d.music.map(s => '<li>' + s + '</li>').join('')}</ul>
    </div>

    ${d.dance ? `
    <div class="section-card dance-card">
      <h3>💃 율동</h3>
      <p>${d.dance}</p>
    </div>` : ''}

    <button class="rain-toggle-btn" id="rainBtn" onclick="toggleRain()">
      🌂 우천 시 실내 대체 프로그램 보기
    </button>

    <div class="section-card rain-card rain-section" id="rainSection">
      <h3>🌧️ 우천 시 실내 대체 프로그램</h3>
      <p><strong>활동 :</strong> ${d.rain.activity}</p>
      <ul style="margin-top:8px;">${d.rain.items.map(s => '<li>' + s + '</li>').join('')}</ul>
    </div>
  `;
  area.scrollIntoView({ behavior: 'smooth' });
}
