죄송해요! 코드가 여러 부분으로 나뉘어서 **붙여넣을 때 오류**가 생긴 거예요.

**지금 바로 완전한 파일 하나**로 드릴게요. 아래 코드를 **처음부터 끝까지 전체 복사**해서 메모장에 붙여넣고 `숲해설.html`로 저장하세요!

```html
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대상자별 맞춤 숲 해설 프로그램</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Malgun Gothic',sans-serif;background:#f0f7ee;padding:20px;color:#2e7d32;}
h1{text-align:center;font-size:1.5em;margin-bottom:6px;color:#1b5e20;}
.sub{text-align:center;color:#558b2f;margin-bottom:24px;font-size:0.9em;}
.box{background:white;border-radius:14px;padding:20px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,0.08);}
.box h2{font-size:1em;color:#388e3c;margin-bottom:14px;}
.brow{display:flex;flex-wrap:wrap;gap:10px;}
.btn{padding:10px 22px;border:2px solid #a5d6a7;border-radius:30px;background:white;color:#388e3c;cursor:pointer;font-size:0.92em;font-family:inherit;}
.btn:hover{background:#e8f5e9;}
.btn.on{background:#388e3c;color:white;border-color:#388e3c;}
#result{display:none;}
.rtitle{font-size:1.3em;font-weight:bold;color:#1b5e20;margin-bottom:8px;}
.tags{margin-bottom:14px;}
.tag{display:inline-block;background:#e8f5e9;color:#2e7d32;border-radius:20px;padding:3px 12px;font-size:0.82em;margin-right:6px;}
.irow{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.ibox{flex:1;min-width:180px;background:#f1f8e9;border-radius:10px;padding:12px;font-size:0.87em;color:#333;}
.ibox b{display:block;color:#1b5e20;margin-bottom:4px;}
.card{border-left:4px solid #66bb6a;background:#f9fbe7;border-radius:0 10px 10px 0;padding:14px 18px;margin-bottom:12px;}
.card h3{font-size:0.93em;color:#2e7d32;margin-bottom:8px;}
.card ul{padding-left:18px;line-height:1.9;font-size:0.89em;color:#333;}
.cs{border-left-color:#e53935;background:#fff5f5;}.cs h3{color:#b71c1c;}
.cm{border-left-color:#8e24aa;background:#fdf6ff;}.cm h3{color:#6a1b9a;}
.cd{border-left-color:#fb8c00;background:#fff8f0;}.cd h3{color:#e65100;}
.cr{border-left-color:#1e88e5;background:#e8f4fd;}.cr h3{color:#0d47a1;}
.rbtn{background:#e3f2fd;border:2px solid #90caf9;color:#1565c0;border-radius:30px;padding:10px 20px;cursor:pointer;font-size:0.9em;font-family:inherit;margin-top:8px;}
#rainBox{display:none;margin-top:12px;}
</style>
</head>
<body>

<h1>🌿 대상자별 맞춤 숲 해설 프로그램</h1>
<p class="sub">대상자와 계절을 선택하면 맞춤 프로그램이 나타납니다</p>

<div class="box">
  <h2>👤 대상자 선택</h2>
  <div class="brow" id="tg">
    <button class="btn" data-g="t" data-v="유아">🧒 유아</button>
    <button class="btn" data-g="t" data-v="초등">📚 초등</button>
    <button class="btn" data-g="t" data-v="사회초년생">💼 사회초년생</button>
    <button class="btn" data-g="t" data-v="50대">🌳 50대 남녀</button>
    <button class="btn" data-g="t" data-v="시니어">🌸 시니어</button>
  </div>
</div>

<div class="box">
  <h2>🍃 계절 선택</h2>
  <div class="brow" id="sg">
    <button class="btn" data-g="s" data-v="봄">🌸 봄</button>
    <button class="btn" data-g="s" data-v="여름">☀️ 여름</button>
    <button class="btn" data-g="s" data-v="가을">🍂 가을</button>
    <button class="btn" data-g="s" data-v="겨울">❄️ 겨울</button>
  </div>
</div>

<div class="box" id="result">
  <div id="rc"></div>
  <button class="rbtn" id="rb">🌂 우천 시 실내 대체 프로그램 보기</button>
  <div id="rainBox"></div>
</div>

<script>
var S = {t:null, s:null};

document.querySelectorAll('.btn').forEach(function(b){
  b.addEventListener('click', function(){
    var g = this.getAttribute('data-g');
    var v = this.getAttribute('data-v');
    var gid = (g==='t') ? 'tg' : 'sg';
    document.querySelectorAll('#'+gid+' .btn').forEach(function(x){ x.classList.remove('on'); });
    this.classList.add('on');
    if(g==='t') S.t = v; else S.s = v;
    if(S.t && S.s) show();
  });
});

document.getElementById('rb').addEventListener('click', function(){
  var b = document.getElementById('rainBox');
  if(b.style.display==='block'){
    b.style.display='none';
    this.textContent='🌂 우천 시 실내 대체 프로그램 보기';
  } else {
    b.style.display='block';
    this.textContent='🌂 우천 대체 프로그램 닫기';
  }
});

function card(cls, title, arr){
  var h = '<div class="card '+cls+'"><h3>'+title+'</h3><ul>';
  arr.forEach(function(s){ h += '<li>'+s+'</li>'; });
  h += '</ul></div>';
  return h;
}

function show(){
  var d = DB[S.t] && DB[S.t][S.s];
  if(!d){ return; }

  var h = '<div class="rtitle">'+d.title+'</div>';
  h += '<div class="tags">';
  d.kw.forEach(function(k){ h += '<span class="tag">'+k+'</span>'; });
  h += '</div>';
  h += '<div class="irow">';
  h += '<div class="ibox"><b>👤 생애주기 특성</b>'+d.life+'</div>';
  h += '<div class="ibox"><b>📍 해설 장소</b>'+d.place+'</div>';
  h += '</div>';
  h += card('cs','🚨 안전규칙 (최우선)',d.safe);
  h += card('','🌱 도입',d.intro);
  h += card('','🌿 전개',d.main);
  h += card('','🍃 마무리',d.end);
  h += card('cm','🎵 추천 음악',d.music);
  if(d.dance) h += card('cd','💃 율동',[d.dance]);

  document.getElementById('rc').innerHTML = h;

  var rh = card('cr','🌧️ 우천 시 실내 대체 프로그램',
    ['활동 : '+d.rain.act, '준비물 : '+d.rain.items.join(', ')]);
  document.getElementById('rainBox').innerHTML = rh;
  document.getElementById('rainBox').style.display = 'none';
  document.getElementById('rb').textContent = '🌂 우천 시 실내 대체 프로그램 보기';

  var el = document.getElementById('result');
  el.style.display = 'block';
  el.scrollIntoView({behavior:'smooth'});
}
