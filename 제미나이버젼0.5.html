        #result { margin-top: 20px; padding: 20px; border: 1px solid #e0e0e0; border-radius: 10px; display: none; background-color: #fafafa; }

        .alternative { background-color: #e3f2fd; border: 1px solid #bbdefb; padding: 10px; border-radius: 5px; margin-top: 15px; }
        .music-box { background-color: #f3e5f5; padding: 10px; border-radius: 5px; margin-top: 10px; font-style: italic; }

function generateProgram() {
    const target = document.getElementById('target').value;
    const season = document.getElementById('season').value;
    const resultDiv = document.getElementById('result');

    if (!target || !season) {
        alert("대상자와 계절을 모두 선택해주세요!");
        return;
    }

    const data = programData[target][season];
    const targetInfo = programData[target]["특성"];

    resultDiv.style.display = "block";
    resultDiv.innerHTML = `
        <h2>[${target} — 「${data.제목}」]</h2>
        <p><strong>💡 대상자 특성:</strong> ${targetInfo}</p>
        
        <div class="safety">
            ⚠️ 안전규칙 (최우선):<br>${data.안전}
        </div>

        <span class="category">📍 해설 장소</span> ${data.장소}
        <span class="category">🏁 도입</span> ${data.도입}
        <span class="category">🏃 전개</span> ${data.전개}
        <span class="category">✨ 마무리</span> ${data.마무리}
        
        <div class="music-box">
            🎵 추천 음악: ${data.음악}<br>
            💃 추천 율동: ${data.율동}
        </div>

        <div class="alternative">
            ☔ 우천 시 대체 프로그램: ${data.우천}
        </div>
    `;
}
