<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대상별 맞춤형 숲 해설 프로그램</title>
    <style>
        :root {
            --primary-green: #2d5a27;
            --light-green: #f1f8e9;
            --accent-red: #d32f2f;
            --text-gray: #333;
        }

        body {
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
            background-color: #f4f7f4;
            color: var(--text-gray);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: var(--primary-green);
            font-size: 2rem;
            margin-bottom: 30px;
            border-bottom: 3px solid var(--primary-green);
            display: inline-block;
            width: 100%;
            padding-bottom: 10px;
        }

        .selection-box {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
            background: var(--light-green);
            padding: 25px;
            border-radius: 12px;
        }

        select, button {
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 8px;
            border: 1px solid #ccc;
            outline: none;
        }

        button {
            background-color: var(--primary-green);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, background 0.3s;
        }

        button:hover {
            background-color: #1e3e1a;
            transform: translateY(-2px);
        }

        #result {
            display: none;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .safety-notice {
            background-color: #fff5f5;
            border: 2px solid var(--accent-red);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .safety-notice h3 {
            color: var(--accent-red);
            margin-top: 0;
            display: flex;
            align-items: center;
        }

        .location-info {
            background: #e8f5e9;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            border-left: 6px solid var(--primary-green);
        }

        .location-info h4 {
            margin: 0 0 10px 0;
            color: var(--primary-green);
        }

        .program-detail h3 {
            border-left: 4px solid var(--primary-green);
            padding-left: 10px;
            color: var(--primary-green);
            margin-top: 30px;
        }

        .grid-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .info-card {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #eee;
        }

        footer {
            text-align: center;
            margin-top: 50px;
            font-size: 0.9rem;
            color: #888;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🌿 맞춤형 숲 해설 프로그램 가이드</h1>

    <div class="selection-box">
        <select id="target">
            <option value="">대상자를 선택하세요</option>
            <option value="toddler">유아 (장소: 서울숲)</option>
            <option value="elementary">초등학생 (장소: 창경궁)</option>
            <option value="adult">사회초년생 (장소: 매헌시민의숲)</option>
        </select>

        <select id="season">
            <option value="">계절을 선택하세요</option>
            <option value="봄">봄</option>
            <option value="여름">여름</option>
            <option value="가을">가을</option>
            <option value="겨울">겨울</option>
        </select>

        <button onclick="generateProgram()">프로그램 생성하기</button>
    </div>

    <div id="result">
        <!-- 안전 수칙이 가장 먼저 나옵니다 -->
        <div class="safety-notice">
            <h3>⚠️ 필독: 안전 관리 수칙</h3>
            <ul>
                <li>해설사 및 인솔자의 안내 경로를 절대 벗어나지 않습니다.</li>
                <li>벌, 뱀, 독충 등 위험 생물을 자극하지 않도록 주의합니다.</li>
                <li>활동 전 가벼운 스트레칭으로 부상을 방지합니다.</li>
                <li>비상 구급함 위치를 사전에 파악하고, 우천 시 미끄러운 바닥을 조심합니다.</li>
            </ul>
        </div>

        <div id="program-content"></div>
    </div>

    <footer>
        &copy; 2024 숲 해설 프로그램 기획 도우미. 모든 프로그램은 실제 장소의 특성을 반영합니다.
    </footer>
</div>

<script>
    const data = {
        toddler: {
            place: "서울숲 (Seoul Forest)",
            history: "과거 임금의 사냥터이자 최초의 상수도 수원지였던 뚝섬 일대를 시민들의 참여로 조성한 도심 속 생태 공원입니다. 평탄한 지형과 나비정원, 사슴 방사장 등이 있어 유아들이 안전하게 자연을 접하기 최적의 장소입니다.",
            targetChar: "오감을 통한 탐색이 중요하며, 짧은 집중력을 고려한 놀이 중심 활동이 필요합니다.",
            activities: {
                "봄": "꽃향기 맡기 및 알록달록 꽃잎 관찰",
                "여름": "바닥분수 물놀이 및 매미 소리 듣기",
                "가을": "바스락 낙엽 밟기 및 도토리 찾기",
                "겨울": "겨울잠 자는 나무 안아주기 및 새 먹이 주기"
            },
            music: "숲속을 걸어요, 멋쟁이 토마토",
            movement: "나비 날갯짓 흉내내기, 나무처럼 기지개 켜기",
            rainy: "방문자 센터 내 실내 생태 전시실 관람 및 자연물 스티커 놀이"
        },
        elementary: {
            place: "창경궁 (Changgyeonggung Palace)",
            history: "조선 성종 때 세워진 궁궐로, 일제강점기 동물원(창경원)으로 격하되었던 아픈 역사를 딛고 복원된 장소입니다. 춘당지와 대온실 주변의 고목들을 통해 역사와 생태를 동시에 배울 수 있는 살아있는 교육장입니다.",
            targetChar: "역사적 맥락과 자연의 원리를 연결하여 이해할 수 있으며, 탐구 활동에 적극적입니다.",
            activities: {
                "봄": "궁궐의 매화와 살구꽃 역사 탐방",
                "여름": "춘당지 수생식물 관찰 및 궁궐의 여름나기 지혜",
                "가을": "궁궐 담장과 어우러진 단풍 지도 만들기",
                "겨울": "대온실(우리나라 최초 서양식 온실) 식물 탐구"
            },
            music: "우리나라 민요 '도라지', 숲의 노래",
            movement: "전통 무예 동작 따라하기, 나무 나이테 표현하기",
            rainy: "궁궐 회랑 걷기 및 전통 문양 그리기 체험"
        },
        adult: {
            place: "매헌시민의숲 (Maeheon Citizen's Forest)",
            history: "우리나라 최초로 숲 개념을 도입한 공원입니다. 매헌 윤봉길 의사의 기념관이 위치하여 역사적 숭고함을 느낄 수 있으며, 울창한 메타세쿼이아 길은 도심 속 직장인들에게 최고의 휴식처를 제공합니다.",
            targetChar: "사회생활의 스트레스를 해소하고, 숲을 통한 정서적 위안과 성찰이 필요한 시기입니다.",
            activities: {
                "봄": "메타세쿼이아 길에서 즐기는 '느리게 걷기' 명상",
                "여름": "울창한 숲 그늘 아래서 즐기는 숲멍(ASMR)",
                "가을": "윤봉길 의사 기념관 방문 및 인생 가치관 되새기기",
                "겨울": "따뜻한 차와 함께하는 숲속 대화 및 한 해 정리"
            },
            music: "비발디 '사계', 자연의 소리(물소리, 새소리)",
            movement: "어깨와 목의 긴장을 푸는 요가 스트레칭",
            rainy: "매헌 기념관 실내 관람 및 숲 테라피 실내 강연"
        }
    };

    function generateProgram() {
        const target = document.getElementById('target').value;
        const season = document.getElementById('season').value;
        const resultDiv = document.getElementById('result');
        const contentDiv = document.getElementById('program-content');

        if (!target || !season) {
            alert("대상자와 계절을 모두 선택해주세요!");
            return;
        }

        const selected = data[target];
        const targetName = document.getElementById('target').options[document.getElementById('target').selectedIndex].text.split(' (')[0];

        contentDiv.innerHTML = `
            <div class="location-info">
                <h4>📍 해설 장소: ${selected.place}</h4>
                <p><strong>역사적·생태적 배경:</strong> ${selected.history}</p>
            </div>

            <div class="program-detail">
                <h2>[${season}] ${targetName} 맞춤형 프로그램</h2>
                <p><strong>대상자 특성:</strong> ${selected.targetChar}</p>

                <h3>1. 도입 (15분)</h3>
                <ul>
                    <li>강사 소개 및 장소의 역사적 의미 설명</li>
                    <li>오늘의 주제: ${season}의 ${selected.place.split(' (')[0]}를 만나다</li>
                    <li>가벼운 몸풀기 및 안전 확인</li>
                </ul>

                <h3>2. 전개 (60분)</h3>
                <div class="info-card">
                    <strong>핵심 활동:</strong> ${selected.activities[season]}<br>
                    <strong>준비물:</strong> 관찰 루페, 활동지, 필기구, 개인 물병, 돗자리
                </div>
                <ul>
                    <li>장소 이동 및 생태 관찰</li>
                    <li>대상별 맞춤 체험 활동 진행</li>
                    <li>자연과 교감하는 시간</li>
                </ul>

                <h3>3. 마무리 (15분)</h3>
                <ul>
                    <li>활동 소감 나누기 및 정리 정돈</li>
                    <li>추천 음악 감상 및 기념사진 촬영</li>
                </ul>

                <div class="grid-info">
                    <div class="info-card">
                        <strong>🎵 추천 음악/율동</strong><br>
                        - 음악: ${selected.music}<br>
                        - 동작: ${selected.movement}
                    </div>
                    <div class="info-card">
                        <strong>☔ 우천 시 대체 프로그램</strong><br>
                        - ${selected.rainy}
                    </div>
                </div>
            </div>
        `;

        resultDiv.style.display = 'block';
        window.scrollTo({ top: resultDiv.offsetTop - 20, behavior: 'smooth' });
    }
</script>

</body>
</html>
