<!DOCTYPE html>
<html lang="ko">

<title>맞춤 숲 해설 프로그램</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Malgun Gothic', sans-serif; background: #f0f7ee; padding: 20px; color: #2e7d32; }

.box h2 { font-size: 1em; color: #388e3c; margin-bottom: 12px; }

.btn-row { display: flex; flex-wrap: wrap; gap: 10px; }
.btn {
  padding: 10px 20px; border: 2px solid #a5d6a7; border-radius: 30px;
  background: white; color: #388e3c; cursor: pointer; font-size: 0.9em; font-family: inherit;
}
.btn:hover { background: #e8f5e9; }
.btn.on { background: #388e3c; color: white; border-color: #388e3c; }

#result { display: none; }
.tag { display: inline-block; background: #e8f5e9; color: #2e7d32; border-radius: 20px; padding: 4px 12px; font-size: 0.85em; margin-right: 6px; margin-bottom: 10px; }
.card { border-left: 4px solid #66bb6a; background: #f9fbe7; border-radius: 0 10px 10px 0; padding: 14px 18px; margin-bottom: 14px; }
.card h3 { font-size: 0.95em; color: #2e7d32; margin-bottom: 8px; }
.card ul { padding-left: 18px; line-height: 1.9; font-size: 0.9em; color: #333; }
.card p { font-size: 0.9em; color: #333; line-height: 1.8; }
.safety { border-left-color: #e53935; background: #fff5f5; }

.music { border-left-color: #8e24aa; background: #fdf6ff; }
.music h3 { color: #6a1b9a; }
.dance { border-left-color: #fb8c00; background: #fff8f0; }
.dance h3 { color: #e65100; }
.rain-card { border-left-color: #1e88e5; background: #e8f4fd; }
.rain-card h3 { color: #0d47a1; }

<h1>🌿 맞춤 숲 해설 프로그램</h1>

</div>

<div class="box">
  <h2>🍃 계절</h2>

    <button class="btn" data-type="season" data-val="봄">🌸 봄</button>
    <button class="btn" data-type="season" data-val="여름">☀️ 여름</button>
    <button class="btn" data-type="season" data-val="가을">🍂 가을</button>
    <button class="btn" data-type="season" data-val="겨울">❄️ 겨울</button>
  </div>
</div>

<div class="box" id="result">
  <div id="resultContent"></div>
  <button class="rain-btn" id="rainBtn">🌂 우천 시 실내 대체 프로그램 보기</button>
  <div id="rainBox"></div>
</div>

<script>
var sel = { target: null, season: null };

// 버튼 클릭 이벤트
document.querySelectorAll('.btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    var type = this.getAttribute('data-type');
    var val  = this.getAttribute('data-val');
    var groupId = (type === 'target') ? 'tGroup' : 'sGroup';

    document.querySelectorAll('#' + groupId + ' .btn').forEach(function(b) {
      b.classList.remove('on');
    });
    this.classList.add('on');
    sel[type] = val;

    if (sel.target && sel.season) showResult();
  });
});

// 우천 토글
document.getElementById('rainBtn').addEventListener('click', function() {
  var box = document.getElementById('rainBox');
  if (box.style.display === 'block') {
    box.style.display = 'none';
    this.textContent = '🌂 우천 시 실내 대체 프로그램 보기';
  } else {
    box.style.display = 'block';
    this.textContent = '🌂 우천 대체 프로그램 닫기';
  }
});

function showResult() {
  var d = getDB(sel.target, sel.season);
  if (!d) return;

  var html = '<div style="font-size:1.3em;font-weight:bold;color:#1b5e20;margin-bottom:6px;">' + d.title + '</div>';
  d.keywords.forEach(function(k) { html += '<span class="tag">' + k + '</span>'; });

  html += '<div class="info-row">';
  html += '<div class="info-item"><b>👤 생애주기 특성</b>' + d.lifecycle + '</div>';
  html += '<div class="info-item"><b>📍 해설 장소</b>' + d.place + '</div>';
  html += '</div>';

  html += '<div class="card safety"><h3>🚨 안전규칙 (최우선)</h3><ul>';
  d.safety.forEach(function(s) { html += '<li>' + s + '</li>'; });
  html += '</ul></div>';

  html += '<div class="card"><h3>🌱 도입</h3><ul>';
  d.intro.forEach(function(s) { html += '<li>' + s + '</li>'; });
  html += '</ul></div>';

  html += '<div class="card"><h3>🌿 전개</h3><ul>';
  d.main.forEach(function(s) { html += '<li>' + s + '</li>'; });
  html += '</ul></div>';

  html += '<div class="card"><h3>🍃 마무리</h3><ul>';
  d.closing.forEach(function(s) { html += '<li>' + s + '</li>'; });
  html += '</ul></div>';

  html += '<div class="card music"><h3>🎵 추천 음악</h3><ul>';
  d.music.forEach(function(s) { html += '<li>' + s + '</li>'; });
  html += '</ul></div>';

  if (d.dance) {
    html += '<div class="card dance"><h3>💃 율동</h3><p>' + d.dance + '</p></div>';
  }

  document.getElementById('resultContent').innerHTML = html;

  var rainHtml = '<div class="card rain-card"><h3>🌧️ 우천 시 실내 대체 프로그램</h3>';
  rainHtml += '<p><b>활동 :</b> ' + d.rain.activity + '</p>';
  rainHtml += '<ul style="margin-top:8px;">';
  d.rain.items.forEach(function(s) { rainHtml += '<li>' + s + '</li>'; });
  rainHtml += '</ul></div>';
  document.getElementById('rainBox').innerHTML = rainHtml;
  document.getElementById('rainBox').style.display = 'none';
  document.getElementById('rainBtn').textContent = '🌂 우천 시 실내 대체 프로그램 보기';

  var result = document.getElementById('result');
  result.style.display = 'block';
  result.scrollIntoView({ behavior: 'smooth' });
}
